name: Data contract and public API

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile data tooling
        run: python -m py_compile scripts/build_public_api.py scripts/analyze_bud_to_sugi_pollen.py tests/test_public_api.py tests/test_prefecture_sample.py tests/test_bud_to_sugi_pollen.py
      - name: Check public BI JavaScript syntax
        run: node --check pollen-bi.js
      - name: Build deterministic public distribution
        run: python scripts/build_public_api.py
      - name: Reproduce bud-to-pollen research result
        run: python tests/test_bud_to_sugi_pollen.py
      - name: Smoke test public distribution
        run: python tests/test_public_api.py
      - name: Verify prefecture sample generation
        run: python tests/test_prefecture_sample.py
      - name: Verify committed artifacts are reproducible
        run: git diff --exit-code -- api/v1 samples/osaka analysis/2024-bud-2025-sugi-pollen.json analysis/2025-bud-2026-sugi-pollen.json
