<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
<title id="title">大阪府 スギ雄花花芽量 2025</title>
<desc id="desc">花芽量16925個毎平方メートル、過去平均5368個毎平方メートル、公式比較率315パーセント。</desc>
<rect width="800" height="420" fill="white"/>
<text x="48" y="55" font-family="sans-serif" font-size="28">大阪府 スギ雄花花芽量 2025</text>
<text x="48" y="100" font-family="sans-serif" font-size="18">花芽量 16,925 個/m² / 過去平均 5,368 個/m² / 公式比較率 315%</text>
<text x="48" y="155" font-family="sans-serif" font-size="16">花芽量</text><rect x="180" y="135" width="508" height="28" fill="#555"/><text x="700" y="156" font-family="sans-serif" font-size="16">16,925</text>
<text x="48" y="215" font-family="sans-serif" font-size="16">過去平均</text><rect x="180" y="195" width="161" height="28" fill="#999"/><text x="353" y="216" font-family="sans-serif" font-size="16">5,368</text>
<text x="48" y="285" font-family="sans-serif" font-size="15">スギ雄花の花芽量であり、空中花粉飛散量そのものや個人の症状を予測する値ではありません。</text>
<text x="48" y="330" font-family="sans-serif" font-size="14">出典: 環境省「令和7年度スギ雄花花芽調査」資料1、1ページ</text>
<text x="48" y="360" font-family="sans-serif" font-size="14">https://www.env.go.jp/content/000365031.pdf</text>
</svg>
